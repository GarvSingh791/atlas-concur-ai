# Alembic configuration file.
#
# The database URL is NOT set here — it is read from the environment via
# database/migrations/env.py (config/settings → Settings.DATABASE_URL).
# Hardcoding the URL here would violate Dev Rule 12 (config in /config,
# secrets in env).

[alembic]
# Path to migration scripts, relative to this file (repo root)
script_location = database/migrations

# Revision file name template
file_template = %%(rev)s_%%(slug)s

# Timezone for revision timestamps
timezone = UTC

# Prepend sys.path so that "database.*", "backend.*", "config.*" resolve
# correctly when Alembic is invoked from the repo root.
prepend_sys_path = .

# sqlalchemy.url is intentionally blank — env.py reads it from Settings.
# Leaving it empty suppresses Alembic's "no URL configured" warning while
# making it obvious that this file is NOT the source of the URL.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
