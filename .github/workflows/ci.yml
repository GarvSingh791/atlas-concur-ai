# Atlas — CI pipeline (P1-T5).
#
# Goal for Phase 1: green pipeline on the empty skeleton. Three parallel-capable
# jobs — backend (Python lint/type/test), frontend (TS lint/format/type/test/build),
# docker-build (both images build, gated on the two test jobs). Hermetic: no live
# Postgres / MinIO / running stack is required.
#
# All env values below are DUMMY, non-sensitive CI stubs using the REAL Settings
# field names (config/settings/base.py). No real secrets here — this file is safe
# for a public repo. Real secrets are wired in the deploy phase (Phase 8).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Backend — Ruff (lint + format check), mypy, pytest. PYTHONPATH is the repo
  # root via pytest's pythonpath=["."], so backend.* and config.* resolve.
  # ---------------------------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    env:
      # Dummy, non-sensitive stubs — required by config.settings at import time.
      # The smoke test never contacts the database (TestClient without lifespan).
      JWT_SECRET: ci-test-secret-not-a-real-key-do-not-use
      DATABASE_URL: postgresql+psycopg2://atlas:atlas@localhost:5432/atlas_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy type check
        run: mypy backend config evals

      - name: pytest
        run: pytest

      # P8-T4 pre-deploy guard: the release entrypoint runs `alembic upgrade head`,
      # which refuses a branched history ("multiple heads") at BOOT. Catch that
      # here, before a merge can reach staging. Offline: needs no database.
      - name: Alembic history has exactly one head
        run: |
          HEADS=$(alembic heads)
          echo "${HEADS}"
          COUNT=$(printf '%s\n' "${HEADS}" | grep -c '(head)' || true)
          if [ "${COUNT}" != "1" ]; then
            echo "::error::expected exactly 1 alembic head, found ${COUNT}"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Secret hygiene (phase 11) — scans the working tree AND the full git history
  # for credential shapes (scripts/ops/secret_scan.py: stdlib only, prints file /
  # line / pattern / 4-char masked prefix, never a value) and audits the env
  # configuration (scripts/ops/env_audit.py: render.yaml secrets are sync:false,
  # no unsafe literals or defaults). Blocking: both were clean when this job was
  # added, so any new finding is a regression. A real hit is ROTATED
  # (docs/runbooks/key-rotation.md), never allow-listed.
  # ---------------------------------------------------------------------------
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Secret scan (working tree + full history)
        run: python scripts/ops/secret_scan.py

      - name: Env / secret configuration audit
        run: |
          pip install "pyyaml>=6.0,<7.0"
          python scripts/ops/env_audit.py

  # ---------------------------------------------------------------------------
  # Frontend — ESLint, Prettier check, tsc, Vitest, production build.
  # ---------------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # AI-eval (DB-backed) — Phase-7 (P7-T3b) AI-output validation gate.
  #
  # This is the brief's APPROVED DEVIATION from the otherwise hermetic-only CI
  # mandate: the Tier-2 eval suite (M-A1 full receipt pipeline, M-A3 corroboration
  # via persisted ai_decision_logs, RAG recall@k + the org-scoping JOIN) genuinely
  # needs a live Postgres + pgvector, so we provision one as a service. It runs
  # ONLY the @pytest.mark.db eval tests (`-m db`) on the deterministic LOCAL
  # provider (LLM_PROVIDER=local) — no live LLM/network in the CI gate.
  #
  # The Tier-1 hermetic eval tests (M-A2 F1, the M-A3 no-silent-pass HARD GATE,
  # captured DecisionRecords, snapshots) need NO database and are ALREADY covered
  # by the `backend` job above: bare `pytest` collects backend/tests/eval/* (it's
  # under testpaths), and the @pytest.mark.db tests there self-skip when Postgres
  # is unreachable. So this job deliberately scopes to `-m db` and does not
  # duplicate Tier-1. Env values are the same DUMMY, non-sensitive CI stubs as the
  # `backend` job; PYTHONHASHSEED=0 pins the local embedder's salted-hash seed so
  # RAG similarities are reproducible.
  # ---------------------------------------------------------------------------
  eval-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: atlas_user
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: atlas_test_aieval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas_user -d atlas_test_aieval"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Dummy, non-sensitive stubs — the dedicated, disposable eval DB. The
      # inherited backend/tests/conftest.py `_schema` autouse fixture runs
      # `alembic upgrade head` + `CREATE EXTENSION vector` against this DB.
      DATABASE_URL: postgresql+psycopg2://atlas_user:change-me@localhost:5432/atlas_test_aieval
      JWT_SECRET: ci-test-secret-not-a-real-key-do-not-use
      PYTHONHASHSEED: "0"
      LLM_PROVIDER: local
      EMBEDDINGS_PROVIDER: local
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: pytest (DB-backed eval tier)
        run: pytest backend/tests/eval -m db -p no:cacheprovider

      - name: Upload eval metrics + regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-metrics
          # R6-T4: metrics.json + the overall/per-doc-type metrics TABLE
          # (rag_corpus_metrics_table.csv) + the risk-coverage curve data (risk_coverage.csv).
          # Phase 11: an explicit allow-list of known, non-secret files (never the whole
          # directory) with short retention — backend/tests/test_ci_workflow_hygiene.py.
          path: |
            evals/reports/metrics.json
            evals/reports/rag_corpus_metrics_table.csv
            evals/reports/risk_coverage.csv
          if-no-files-found: warn
          retention-days: 3

  # ---------------------------------------------------------------------------
  # E2E (Playwright) — Phase-7 (P7-T4) full UX flow per role against the LIVE
  # stack. Gated on `backend` (unit + API) AND `eval-db` (AI-output validation),
  # so the browser suite runs only after the deterministic backend + AI gates are
  # green. That is the Phase-7 Checkpoint: unit + API + AI-validation + E2E.
  #
  # Determinism: LLM / OCR / EMBEDDINGS / STORAGE all = local — no live network,
  # no Gemini. MinIO is provisioned for forward-compat, but the suite runs
  # STORAGE_PROVIDER=local (boto3 has shipped in the backend image since 7212a96),
  # so this lane does not exercise the real storage path.
  #
  # Server orchestration: the backend is started in-step (background processes do
  # not survive across GH-Actions steps), then Playwright's webServer boots the
  # frontend itself (reuseExistingServer is false in CI). Only the deterministic,
  # self-seeding p7t4 projects run here — the legacy P6 specs depend on one-shot
  # seed fixtures and belong to P6-T1's verification, not this gate.
  # ---------------------------------------------------------------------------
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, eval-db]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: atlas_user
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: atlas_test_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas_user -d atlas_test_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Provisioned for forward-compat (real storage path); minio/minio left Docker
      # Hub, so this is Chainguard's build. The suite itself runs
      # STORAGE_PROVIDER=local, so this service is not yet exercised — hence no
      # health gate (the minio image has no guaranteed in-container curl).
      minio:
        image: cgr.dev/chainguard/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
          - 9001:9001
    env:
      # Dummy, non-sensitive CI stubs using the REAL Settings field names. All
      # providers local → deterministic, no live network.
      DATABASE_URL: postgresql+psycopg2://atlas_user:change-me@localhost:5432/atlas_test_e2e
      JWT_SECRET: ci-test-secret-not-a-real-key-do-not-use
      # The browser hydrates its session via a CROSS-ORIGIN fetch (:3000 → :8000)
      # to /auth/refresh + /me; without the frontend origin in CORS_ALLOWED_ORIGINS
      # the middleware sends no Access-Control-Allow-Origin and the browser blocks
      # the refresh, so the session never hydrates (the local .env sets this too).
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8000
      LLM_PROVIDER: local
      OCR_PROVIDER: local
      EMBEDDINGS_PROVIDER: local
      STORAGE_PROVIDER: local
      PYTHONHASHSEED: "0"
      PYTHONPATH: .
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      # Phase 11: the suite logs in many times from one IP; the limiter itself
      # is covered by the backend tests (production default stays ON).
      RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browser (chromium + OS deps)
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # Phase 11 (public-demo security): the E2E lane must never log in with the
      # published demo password (it is also the staging demo password). Each run
      # mints a throwaway, masked SEED_DEFAULT_PASSWORD; the seed hashes it and the
      # Playwright suite reads the same env var (frontend/e2e/helpers.ts).
      - name: Throwaway seed password for this run (masked)
        run: |
          PW="ci-$(openssl rand -hex 24)"
          echo "::add-mask::${PW}"
          echo "SEED_DEFAULT_PASSWORD=${PW}" >> "$GITHUB_ENV"

      - name: Migrate + seed the E2E database
        run: |
          alembic upgrade head
          python -m database.seeds.seed_all

      - name: Run E2E (start backend in-step; Playwright boots the frontend)
        run: |
          set -euo pipefail
          uvicorn backend.app.main_entry.app:app --host 0.0.0.0 --port 8000 &
          BACKEND_PID=$!
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:8000/health >/dev/null 2>&1 || { echo "backend not healthy"; exit 1; }
          cd frontend
          set +e
          # Phase 11: no --reporter / --trace flags here. CLI flags override
          # playwright.artifact-policy.ts, and the HTML reporter + traces record
          # the login body and live tokens verbatim. The policy's default is the
          # list reporter with traces, screenshots and video off; the job log is
          # the only output and NO Playwright artifact is uploaded (the old HTML
          # report artifact was a credential dump). Enforced by
          # backend/tests/test_ci_workflow_hygiene.py.
          npx playwright test \
            --project=setup \
            --project=p7t4-employee \
            --project=p7t4-manager \
            --project=p7t4-finance
          STATUS=$?
          set -e
          kill "$BACKEND_PID" 2>/dev/null || true
          # Session state never outlives the step (it holds live refresh tokens).
          rm -rf .auth e2e/.auth playwright-report test-results e2e/.artifacts
          exit $STATUS

  # ---------------------------------------------------------------------------
  # Docker build & smoke test (P8-T1) — proves both images build, the boto3
  # carry-forward shipped, and the full compose stack boots and answers on both
  # edges. Contexts mirror docker/docker-compose.yml exactly: backend = repo
  # root, frontend = frontend/. `load: true` puts the built images in the daemon
  # so they can be run. The smoke test sources .env.example (non-secret stubs;
  # SEED_ON_STARTUP=false) so the backend entrypoint only migrates.
  # ---------------------------------------------------------------------------
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: false
          load: true
          tags: atlas-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: docker/Dockerfile.frontend
          push: false
          load: true
          tags: atlas-frontend:ci
          # Build-time inlined, non-sensitive public values (match compose defaults).
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
            NEXT_PUBLIC_APP_NAME=Atlas
            NEXT_PUBLIC_APP_ENV=development

      # P8-T1: prove the boto3 carry-forward shipped in the built image (real
      # receipt uploads 500'd without it, as it was previously dev-only).
      # --entrypoint python bypasses the image ENTRYPOINT (alembic upgrade head),
      # which would otherwise run first and fail with no DATABASE_URL/JWT_SECRET.
      # This is a pure import check of the image layer, no DB needed.
      - name: Verify boto3 present in backend image
        run: |
          docker run --rm --entrypoint python atlas-backend:ci \
            -c "import boto3; print('boto3', boto3.__version__)"

      # P8-T1: full-stack smoke test — the compose stack boots and both edges
      # answer. .env.example provides non-secret stubs and SEED_ON_STARTUP=false,
      # so the backend entrypoint only migrates (fast); the postgres init script
      # provisions the pgcrypto + vector extensions on the fresh volume.
      - name: Full-stack compose smoke test
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose --env-file .env -f docker/docker-compose.yml up -d --build
          # Wait up to 180s for backend AND frontend to report healthy.
          ok=""
          for i in $(seq 1 36); do
            b="$(docker inspect -f '{{.State.Health.Status}}' atlas-backend 2>/dev/null || echo starting)"
            f="$(docker inspect -f '{{.State.Health.Status}}' atlas-frontend 2>/dev/null || echo starting)"
            echo "attempt $i: backend=$b frontend=$f"
            if [ "$b" = "healthy" ] && [ "$f" = "healthy" ]; then ok=1; break; fi
            sleep 5
          done
          docker compose --env-file .env -f docker/docker-compose.yml logs backend | tail -40
          [ -n "$ok" ] || { echo "stack did not become healthy"; docker compose --env-file .env -f docker/docker-compose.yml down -v; exit 1; }
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:3000/ >/dev/null
          echo "SMOKE_OK"
          docker compose --env-file .env -f docker/docker-compose.yml down -v

  # ---------------------------------------------------------------------------
  # Deploy to staging (P8-T4) — the FINAL gate. Runs ONLY on a push to main, and
  # ONLY after every test/build job above is green (needs: all five, plus the
  # phase-11 secret-scan job). This is why
  # render.yaml keeps autoDeploy:false — CI is the SOLE backend deploy trigger, so a
  # failed suite can never ship to staging. The frontend is built by Vercel's Git
  # integration, which holds promotion until the same five jobs pass (Vercel
  # Deployment Checks) and skips builds when frontend/ is unchanged
  # (frontend/vercel.json ignoreCommand).
  #
  # Commit-level verification (P8-T4): a plain /health poll is a false green —
  # the OLD release keeps answering while Render builds the new image. Both
  # services now report the commit they run (backend /health "commit" =
  # RENDER_GIT_COMMIT; frontend /api/version = VERCEL_GIT_COMMIT_SHA), and this
  # job waits for the expected commit (scripts/ci/wait_for_commit.sh).
  #
  # Sequence: fire the Render deploy hook PINNED to this run's commit
  # (`ref=GITHUB_SHA`, so Render deploys exactly the commit these five jobs
  # tested, never a newer untested head of main) -> wait for the backend to report
  # GITHUB_SHA (proves the new release booted, and so that `alembic upgrade head`
  # succeeded: docker/entrypoints/backend-entrypoint.sh runs it under `set -e`, a
  # failed migration exits the container and Render never swaps the release in)
  # -> wait for the frontend to report the newest commit that touched frontend/
  # (GITHUB_SHA when this commit changed frontend/; otherwise the build Vercel
  # kept, since its ignoreCommand skipped this one) -> liveness -> three-role
  # login smoke -> CORS pair.
  #
  # concurrency: deploys queue, never overlap, and are never cancelled midway, so
  # every merge's run verifies its own release (cancel-in-progress: false).
  #
  # Secrets (GitHub -> Settings -> Secrets and variables -> Actions). No value is
  # ever committed or printed; they reach the steps only through env:
  #   RENDER_DEPLOY_HOOK_URL  — Render deploy hook (treat as a production secret)
  #   STAGING_*_URL           — the backend + frontend base URLs (values & rotation
  #                             in docs/staging_env_map.md, "GitHub Actions Secrets")
  # Rollback: docs/runbooks/rollback.md.
  # ---------------------------------------------------------------------------
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [backend, frontend, eval-db, e2e, docker-build, secret-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
    # Poll budget is 15 min per service (W0: Render builds took 40 s - 1 m 37 s;
    # Vercel builds + Deployment Checks fit well inside). Job cap sits above the
    # sum of both waits plus the smoke steps. Time queued behind another deploy
    # in the concurrency group does not count against it.
    timeout-minutes: 40
    env:
      BACKEND_URL: ${{ secrets.STAGING_BACKEND_URL }}
      FRONTEND_URL: ${{ secrets.STAGING_FRONTEND_URL }}
      EXPECTED_SHA: ${{ github.sha }}
      WAIT_BUDGET_SECONDS: "900"
    steps:
      # Full history: needed to find the newest commit that touched frontend/.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize staging URLs
        run: |
          # Strip one trailing slash so "${URL}/health" never becomes "//health" and
          # the CORS origin compares exactly. Values stay masked in the log.
          echo "BACKEND_URL=${BACKEND_URL%/}" >> "$GITHUB_ENV"
          echo "FRONTEND_URL=${FRONTEND_URL%/}" >> "$GITHUB_ENV"

      - name: Which frontend commit should be live?
        id: changes
        run: |
          # Vercel's ignoreCommand (frontend/vercel.json) skips the build when a
          # commit leaves frontend/ unchanged, so production must serve the NEWEST
          # commit that touched frontend/. That is GITHUB_SHA when this commit
          # changed frontend/. Always waiting for it also catches an earlier
          # frontend change whose build was never promoted.
          FRONTEND_SHA=$(git log -1 --format=%H HEAD -- frontend/)
          echo "frontend_sha=${FRONTEND_SHA}" >> "$GITHUB_OUTPUT"
          if [ "${FRONTEND_SHA}" = "${EXPECTED_SHA}" ]; then
            echo "this commit changed frontend/: expecting the frontend at ${FRONTEND_SHA}"
          else
            echo "frontend/ unchanged here (Vercel skips the build): expecting the frontend at ${FRONTEND_SHA}"
          fi

      - name: Trigger Render backend deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          # Prints the status code ONLY, never the URL (the hook URL is a secret).
          # ref=<sha> pins the deploy to the commit this run tested (Render deploy
          # hooks accept a commit SHA via `ref`; an unknown SHA is a non-2xx).
          # The hook URL already carries `?key=...`, so the separator is normally &.
          case "${RENDER_DEPLOY_HOOK_URL}" in *\?*) SEP='&' ;; *) SEP='?' ;; esac
          # `|| echo 000`: under `bash -eo pipefail` a failed curl inside $(...)
          # would abort the step before our own check could report it.
          HTTP=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "${RENDER_DEPLOY_HOOK_URL}${SEP}ref=${EXPECTED_SHA}" 2>/dev/null || echo "000")
          echo "Render deploy hook response: HTTP ${HTTP}"
          # Render ACKs asynchronously (202 = queued). Any 2xx means "accepted";
          # the next step proves the deploy itself.
          case "${HTTP}" in
            2[0-9][0-9]) echo "DEPLOY_TRIGGERED (HTTP ${HTTP})" ;;
            *) echo "::error::DEPLOY_HOOK_FAILED: HTTP ${HTTP}"; exit 1 ;;
          esac

      - name: Wait for backend to serve this commit (release + migration proof)
        run: |
          # A failed `alembic upgrade head` exits the new container, Render keeps
          # the old release, and this wait times out naming the OLD sha — so the
          # new sha being live is the evidence that the migration succeeded.
          scripts/ci/wait_for_commit.sh "${BACKEND_URL}/health" "${EXPECTED_SHA}" "${WAIT_BUDGET_SECONDS}"
          curl -fsS --max-time 20 "${BACKEND_URL}/health"; echo

      - name: Wait for frontend to serve the expected commit
        env:
          FRONTEND_SHA: ${{ steps.changes.outputs.frontend_sha }}
        run: |
          scripts/ci/wait_for_commit.sh "${FRONTEND_URL}/api/version" "${FRONTEND_SHA}" "${WAIT_BUDGET_SECONDS}"

      - name: Verify frontend answers (production domain)
        run: |
          # `|| echo 000` for the same errexit reason as the hook step.
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${FRONTEND_URL}" 2>/dev/null || echo "000")
          echo "Frontend status: HTTP ${STATUS}"
          if [ "${STATUS}" = "200" ] || [ "${STATUS}" = "307" ]; then
            echo "FRONTEND_OK"
          else
            echo "::error::FRONTEND_FAIL: HTTP ${STATUS}"
            exit 1
          fi

      - name: Post-deploy smoke test — 3-role auth
        env:
          # Phase 11: the demo password comes from a repository secret, never a
          # literal in this file. Until the owner sets STAGING_DEMO_PASSWORD the step
          # falls back to the PUBLISHED default documented in .env.example (the demo
          # accounts' current password) and warns; see
          # docs/runbooks/public-demo-checklist.md.
          STAGING_DEMO_PASSWORD: ${{ secrets.STAGING_DEMO_PASSWORD }}
        run: |
          if [ -n "${STAGING_DEMO_PASSWORD}" ]; then
            DEMO_PW="${STAGING_DEMO_PASSWORD}"
          else
            echo "::warning::STAGING_DEMO_PASSWORD secret is not set; using the published demo default from .env.example"
            DEMO_PW="$(sed -n 's/^SEED_DEFAULT_PASSWORD=//p' .env.example | head -n1)"
          fi
          echo "::add-mask::${DEMO_PW}"
          ALL_PASS=true
          # The login endpoint always returns JSON (200 token, or a 4xx JSON error), so a
          # non-JSON / empty body is an INFRA blip (Render cold-start, gateway 5xx, timeout),
          # not an auth failure. Retry transient responses (5xx / 000 / non-JSON); stop early
          # on a real 4xx auth error. Phase 11: the response body is NEVER printed (a 200
          # body carries live access + refresh tokens); on failure only the HTTP status and
          # the error-envelope code are shown. The JSON request body is built by python so
          # the password is never interpolated into a shell-quoted literal.
          for ROLE in employee manager finance; do
            RESULT="FAIL"; CODE="000"; ERR_CODE="-"
            for ATTEMPT in 1 2 3 4; do
              REQ=$(ROLE="${ROLE}" DEMO_PW="${DEMO_PW}" python3 -c 'import json,os; print(json.dumps({"email": os.environ["ROLE"] + "@atlas-demo.internal", "password": os.environ["DEMO_PW"]}))')
              OUT=$(mktemp)
              CODE=$(curl -s -o "${OUT}" -w '%{http_code}' -X POST "${BACKEND_URL}/api/v1/auth/login" \
                -H "Content-Type: application/json" --data-binary @- --max-time 25 \
                <<< "${REQ}" 2>/dev/null || echo "000")
              # Classify the body without printing it: OK when it carries an access
              # token; otherwise extract only the error-envelope code.
              VERDICT=$(python3 - "${OUT}" <<'PY' 2>/dev/null || echo "unparseable"
          import json, sys
          try:
              body = json.load(open(sys.argv[1]))
          except Exception:
              print("unparseable"); sys.exit(0)
          if isinstance(body, dict) and body.get("access_token"):
              print("token")
          else:
              err = body.get("error") if isinstance(body, dict) else None
              code = err.get("code") if isinstance(err, dict) else None
              print(str(code or "no-error-code")[:40])
          PY
              )
              rm -f "${OUT}"
              if [ "$CODE" = "200" ] && [ "$VERDICT" = "token" ]; then
                RESULT="OK"; break
              fi
              ERR_CODE="${VERDICT}"
              case "$CODE" in
                4*) RESULT="FAIL:http_${CODE}"; break ;;   # real auth/validation error — no retry
                *)  RESULT="FAIL:http_${CODE}"; echo "  ${ROLE} attempt ${ATTEMPT}: HTTP ${CODE}, retrying…"; sleep 6 ;;
              esac
            done
            echo "${ROLE}: ${RESULT}"
            if [ "$RESULT" != "OK" ]; then
              ALL_PASS=false
              echo "  -> last HTTP ${CODE}; error code: ${ERR_CODE}"
            fi
          done
          if [ "${ALL_PASS}" = "true" ]; then
            echo "ALL_ROLES_AUTH_OK"
          else
            echo "::error::AUTH_SMOKE_FAILED — check seeding and env vars"
            exit 1
          fi

      - name: Post-deploy smoke test — CORS preflight pair
        run: |
          # The allowed origin (the production frontend) must be accepted (200 with
          # a matching Access-Control-Allow-Origin); a foreign origin must be refused
          # (Starlette answers a disallowed preflight with 400).
          preflight() {
            curl -s -o /dev/null -w '%{http_code}' --max-time 25 -X OPTIONS \
              "${BACKEND_URL}/api/v1/auth/login" \
              -H "Origin: $1" \
              -H "Access-Control-Request-Method: POST" \
              -H "Access-Control-Request-Headers: content-type" 2>/dev/null || echo "000"
          }
          ALLOWED_ORIGIN="${FRONTEND_URL}"
          OK_CODE=$(preflight "${ALLOWED_ORIGIN}")
          ACAO=$(curl -s -D - -o /dev/null --max-time 25 -X OPTIONS \
            "${BACKEND_URL}/api/v1/auth/login" \
            -H "Origin: ${ALLOWED_ORIGIN}" \
            -H "Access-Control-Request-Method: POST" 2>/dev/null |
            tr -d '\r' | awk 'tolower($1)=="access-control-allow-origin:" {print $2}' || true)
          BAD_CODE=$(preflight "https://not-atlas.invalid")
          echo "allowed origin preflight: HTTP ${OK_CODE} (ACAO matches: $([ "${ACAO}" = "${ALLOWED_ORIGIN}" ] && echo yes || echo no))"
          echo "foreign origin preflight: HTTP ${BAD_CODE}"
          if [ "${OK_CODE}" = "200" ] && [ "${ACAO}" = "${ALLOWED_ORIGIN}" ] && [ "${BAD_CODE}" = "400" ]; then
            echo "CORS_OK — staging deploy verified at ${EXPECTED_SHA}"
          else
            echo "::error::CORS_FAIL (expected 200 + matching ACAO for the allowed origin, 400 for a foreign one)"
            exit 1
          fi
